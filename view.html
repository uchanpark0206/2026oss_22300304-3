
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서 상세 정보</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="my.css">
</head>
<body>
    <header class="container mt-4">
        <h1>📚 도서 상세페이지</h1>
        <hr>
    </header>

    <main class="container"> 
        <div class="mb-3">
            <a href="index.html" class="btn btn-secondary">목록으로 돌아가기</a>
        </div>
        
        <table class="table table-hover table-bordered text-center align-middle">
            <thead class="table-light">
                <tr>
                    <th>고유번호</th>
                    <th>도서명</th>
                    <th>저자</th>
                    <th>카테고리</th>
                    <th>편집</th>
                    <th>삭제</th>
                </tr>
            </thead>
            <!-- 자바스크립트가 데이터를 채워 넣을 수 있게 id를 줍니다 -->
            <tbody id="detailTableBody">
            </tbody>
        </table>
    </main>

    <!-- 스크립트는 항상 </body> 바로 위에 둡니다 -->
    <script>
        // 1. 주소창(URL)에서 ?id= 뒤에 있는 숫자(고유번호) 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const bookId = urlParams.get('id');

        // 2. 메모장(localStorage)에서 전체 책 데이터 불러오기
        let books = JSON.parse(localStorage.getItem('bookData')) || [];

        // 3. 전체 책 중에서 주소창의 id와 똑같은 책 '딱 1권'만 찾기
        // (URL에서 가져온 값은 문자열이므로 == 기호로 비교합니다)
        const targetBook = books.find(book => book.id == bookId);

        const tbody = document.getElementById('detailTableBody');

        // 4. 찾은 책이 있다면 화면에 예쁘게 그려주기
        if (targetBook) {
            tbody.innerHTML = `
                <tr>
                    <td>${targetBook.id}</td>
                    <td class="fw-bold text-primary">${targetBook.title}</td>
                    <td>${targetBook.author}</td>
                    <td>${targetBook.category}</td>
                    <!-- 편집 버튼은 edit.html로 이동하도록 과제에 맞춰 수정했습니다 -->
                    <td><a href="edit.html?id=${targetBook.id}" class="btn btn-primary">편집</a></td>
                    <!-- 삭제 버튼은 클릭 시 deleteBook() 함수를 실행합니다 -->
                    <td><button type="button" class="btn btn-danger" onclick="deleteBook(${targetBook.id})">삭제</button></td>
                </tr>
            `;
        } else {
            // 주소창 번호가 이상하거나 책을 찾지 못했을 때
            tbody.innerHTML = `<tr><td colspan="6">해당 도서 정보를 찾을 수 없습니다.</td></tr>`;
        }

        // 5. [삭제] 버튼을 눌렀을 때 실행될 함수 (보너스로 완벽하게 구현해 드립니다!)
        function deleteBook(idToDelete) {
            if (confirm("정말 이 도서를 삭제하시겠습니까?")) {
                // 전체 책 목록에서 방금 누른 책만 '쏙 빼고(filter)' 남은 책들만 묶습니다.
                const remainingBooks = books.filter(book => book.id != idToDelete);
                
                // 남은 책들을 다시 메모장에 덮어씁니다 (삭제 완료!)
                localStorage.setItem('bookData', JSON.stringify(remainingBooks));
                
                alert("삭제되었습니다.");
                // 삭제가 끝났으니 다시 메인 목록 페이지로 쫓아냅니다.
                window.location.href = "index.html";
            }
        }
    </script>
</body>
</html>
