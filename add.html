<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서 추가</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="my.css">
</head>
<body>
    <div class="container mt-5">
        <header>
        <h2>도서 등록</h2>
        </header>
        <hr>
        <!-- form 전송 시 validateForm() 자바스크립트 함수를 먼저 실행합니다. -->
        <form onsubmit="return validateForm()" action="index.html">
            
            <div class="mb-3">
                <label class="form-label">도서명 (필수)</label>
                <input type="text" id="bookTitle" class="form-control" placeholder="도서명을 입력하세요">
            </div>

            <div class="mb-3">
                <label class="form-label">저자(필수)</label>
                <input type="text" id="bookAuthor" class="form-control" placeholder="저자명을 입력하세요">
            </div>

            <div class="mb-3">
                <label class="form-label">출판수(필수)</label>
                <input type="text" id="bookPublisher" class="form-control" placeholder="출판사를 입력하세요">
            </div>

            <div class="mb-3">
                <label class="form-label">출판년도 (1900년 ~ 2024년)</label>
                <input type="number" id="bookYear" class="form-control"placeholder="1900~2024년 사이의 연도 입력">
            </div>

            <div class="mb-3">
                <label class="form-label">ISBN (13자리)</label>
                <input type="text" id="bookIsbn" class="form-control" placeholder="숫자 13자리 입력">
            </div>

            <div class="mb-3">
                <label class="form-label">카테고리</label>
                <select id="bookCategory" class="form-select">
                    <option value="">선택하세요</option>
                    <option value="소설">소설</option>
                    <option value="IT">IT/프로그래밍</option>
                    <option value="에세이">에세이</option>
                </select>
            </div>

            <footer class="mt-4">
                <button type="submit" class="btn btn-success">추가하기</button>
                <a href="index.html" class="btn btn-secondary">취소</a>
            </footer>
        </form>
    </div>

    <!-- 핵심! 자바스크립트 검증 로직 -->
    <script>
    function validateForm() {
        const title = document.getElementById('bookTitle').value;
        const author = document.getElementById('bookAuthor').value;
        const publisher = document.getElementById('bookPublisher').value;
        const year = document.getElementById('bookYear').value;
        const isbn = document.getElementById('bookIsbn').value;
        const category = document.getElementById('bookCategory').value;

        // 1. 필수값 등 검증
        if (title.trim() === "") { alert("도서명은 필수 입력 항목입니다."); return false; }
        if (author.trim() === "") { alert("저자명은 필수 입력 항목입니다."); return false; }
        if (year !== "" && (year < 1900 || year > 2024)) { alert("출판년도는 1900년에서 2024년 사이여야 합니다."); return false; }
        if (isbn !== "" && isbn.length !== 13) { alert("ISBN은 정확히 13자리여야 합니다."); return false; }
        if (category === "") { alert("카테고리를 선택해 주세요."); return false; }

        // 2. 새 책 데이터 묶기 (모두 소문자로 통일!)
        const newBook = {
            id: Date.now(),
            title: title,
            author: author,
            category: category
        };

        // 3. 'bookData'라는 새로운 이름의 깨끗한 메모장을 엽니다.
        let books = JSON.parse(localStorage.getItem('bookData')) || [];
        books.push(newBook);
        localStorage.setItem('bookData', JSON.stringify(books));

        alert("게시물이 성공적으로 추가됩니다!");
        return true; 
    }
</script>
</body>
</html>
