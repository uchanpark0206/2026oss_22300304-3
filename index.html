<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서 관리 시스템</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="my.css">
</head>
<body>
    <div class="container mt-5">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <h2>📚 내 서재 관리 (도서 목록)</h2>
        
        </header>
        <main class="table-responsive">
            <table class="table table-hover table-bordered text-center align-middle">
                <thead class="table-light">
                    <tr>
                        <th>번호</th>
                        <th>도서명</th>
                        <th>저자</th>
                        <th>카테고리</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <!-- HTML에서는 안을 비워두고 id만 달아줌. -->
                <tbody id="bookTableBody">
                </tbody>
            </table>
        </main>
        <footer>
            <a href="add.html" class="btn btn-primary">새 도서 추가 [Add]</a>
            <form onsubmit="return reset_data()" action="index.html">
                <button type="submit" class="btn btn-success">리셋</button>
            </form> 
        </footer>
    </div>

    <!-- 스크립트로 데이터와 표를 연결 -->
    <script>
    function reset_data(){
        localStorage.removeItem('bookData');
        alert("성공적으로 초기화 되었습니다.")
    }




    // 1. 'bookData' 메모장이 비어있으면 예시항목샘플 데이터를 새로 넣는다
    if (localStorage.getItem('bookData') === null) {
        const sampleData = [
            { id: 1, title: '해리포터와 마법사의 돌', author: '조앤 K. 롤링', category: '소설' },
            { id: 2, title: '클린 코드 (Clean Code)', author: '로버트 C. 마틴', category: 'IT/프로그래밍' }
        ];
        localStorage.setItem('bookData', JSON.stringify(sampleData));
    }

    // 2. 새로운 'bookData' 소셜 스토리지 에서 책 목록 불러오기
    let books = JSON.parse(localStorage.getItem('bookData')) || [];
    const tbody = document.getElementById('bookTableBody');

    // 3. 데이터를 화면(표)에 그려주기
    if (books.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5">등록된 도서가 없습니다.</td></tr>';
    } else {
        books.forEach((book, index) => {
            const row = `
                <tr>
                    <td>${index + 1}</td>
                    <td><a href="view.html?id=${book.id}" class="text-decoration-none fw-bold">${book.title}</a></td>
                    <td>${book.author}</td>
                    <td>${book.category}</td>
                    <td>
                        <a href="view.html?id=${book.id}" class="btn btn-sm btn-outline-secondary">상세보기</a>
                    </td>
                </tr>
            `;
            tbody.innerHTML += row; 
        });
    }
</script>
</body>
</html>

</body>
</html>
